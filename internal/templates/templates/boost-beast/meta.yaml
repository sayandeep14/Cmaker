name: boost-beast
description: Minimal C++ HTTP backend service using Boost.Beast, installed via your system package manager (brew/apt) - Boost isn't realistically CPM-fetched from source
cpp_version: 17
dependencies:
  - name: boost
    kind: system_package
    find_package: Boost
    package_managers:
      brew: boost
      apt: libboost-all-dev
    link: [Boost::headers]
