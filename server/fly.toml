# Fly.io app config for the cmaker packs API server (see ../PACKS_PLAN.md).
# `app` is a placeholder - replace with the real app name after `fly launch`
# (or `fly apps create <name>`) creates it.
app = "cmaker-packs-api"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
