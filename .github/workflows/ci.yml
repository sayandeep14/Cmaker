name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit)
        run: go test ./...

      - name: go test (integration)
        # Real scaffold -> cmake -> compiler -> run pipeline. Gated behind
        # the "integration" build tag (see integration_test.go); individual
        # tests self-skip via requireTool() if cmake/a compiler isn't on
        # PATH, so this stays safe to run even on a runner image that
        # changes what's preinstalled.
        run: go test -tags=integration ./...
